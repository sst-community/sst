name: check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Go modules
        run: go mod download

      - name: Check types
        run: cd platform && bun tsc --noEmit

      - name: Build platform
        run: ./platform/scripts/build
        env:
          DOCKER_PUSH: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Run Go tests
        run: go test -vet=all ./...

      # The components' tests, under a mock of the deploy engine. Node 22 or
      # later, as an app's config needs.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run platform tests
        run: bun run test:platform

      - name: Build CLI
        run: go build -o sst ./cmd/sst

      - name: Build docs
        run: cd www && bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The dev watcher uses FSEvents on macOS, through purego, and the job above
  # runs on Linux, which uses inotify. This runs the watcher's tests on Apple
  # Silicon and on Intel, where purego's calling convention differs, with
  # FSEvents and again with the kqueue fallback.
  watcher-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true

      # The platform package embeds platform/dist, and the watcher imports it
      # through pkg/project. Its tests don't read it, so a placeholder saves
      # building the platform, which needs Docker.
      - name: Stand in for the platform build
        run: mkdir -p platform/dist && touch platform/dist/placeholder

      - name: Run watcher tests with FSEvents
        run: go test -race -vet=all ./cmd/sst/mosaic/watcher/

      # Release builds use CGO_ENABLED=0, where purego loads FSEvents without
      # cgo's runtime. -race needs cgo, so this run is without it.
      - name: Run watcher tests with FSEvents, without cgo
        run: go test -vet=all ./cmd/sst/mosaic/watcher/
        env:
          CGO_ENABLED: "0"

      - name: Run watcher tests with kqueue
        run: go test -race -vet=all ./cmd/sst/mosaic/watcher/
        env:
          SST_WATCHER: kqueue
