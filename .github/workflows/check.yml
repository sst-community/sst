name: check

# v5 runs it too, as its pre-releases are tagged on that branch.
on:
  push:
    branches:
      - main
      - v5
  pull_request:
    branches:
      - main
      - v5
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Go modules
        run: go mod download

      - name: Check types
        run: cd platform && bun tsc --noEmit

      # What an app's code reads of the SDK, `import { Resource } from "sst"`
      # and the rest, without skipLibCheck
      - name: Check the SDK's types
        run: cd sdk/js && bun run build && bun ./scripts/types.ts

      - name: Build platform
        run: ./platform/scripts/build
        env:
          DOCKER_PUSH: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Run Go tests
        run: go test -vet=all ./...

      # The components' tests, under a mock of the deploy engine. Node 22 or
      # later, as an app's config needs.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run platform tests
        run: bun run test:platform

      # The component package an author copies, against `sst` packed from
      # this commit, so a change that breaks a package fails here
      - name: Test the component package template
        run: |
          mkdir -p "$RUNNER_TEMP/sst"
          (cd sdk/js && bun run build && bun ./scripts/platform.ts "$RUNNER_TEMP/sst")
          cd examples/component-package
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --no-save "$RUNNER_TEMP/sst/sst-0.0.0.tgz"
          npm test

      - name: Build CLI
        run: go build -o sst ./cmd/sst

      - name: Build docs
        run: cd www && bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
