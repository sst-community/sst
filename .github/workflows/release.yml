name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Only v* tags, which only admins and the releasers team can push, can run
    # in this environment. npm's trusted publishers require it, and the Discord
    # webhook is its secret, so a workflow on another branch can't publish or
    # post.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Go modules
        run: go mod download

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: TypeScript check
        run: cd platform && bun tsc --noEmit

      # Pushes ghcr.io/sst-community/sst/bridge-task, the image task.ts runs
      # for `sst dev`. The GHCR package must be public for ECS to pull it.
      - name: Build platform
        run: ./platform/scripts/build
        env:
          DOCKER_PUSH: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Run Go tests
        run: go test -vet=all ./...

      # Hand-written notes in .github/release-notes/<tag>.md replace the
      # generated changelog, e.g. for the first release, which has no earlier
      # fork tag to list commits from.
      - name: Release notes
        id: notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then echo "args=--release-notes $notes" >> "$GITHUB_OUTPUT"; fi

      # `sst version` names the SST release a build is on: the newest SST tag
      # in its history. SST's tags go under refs/upstream-tags/, not
      # refs/tags/, so goreleaser can't take one for the previous release.
      - name: Find the SST release
        run: |
          git fetch --quiet --no-tags https://github.com/anomalyco/sst.git '+refs/tags/v*:refs/upstream-tags/v*'
          base=$(git for-each-ref --merged HEAD --sort=-version:refname --format='%(refname:lstrip=2)' refs/upstream-tags/ \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          echo "Built on SST ${base:-(none found)}"
          echo "SST_UPSTREAM=${base#v}" >> "$GITHUB_ENV"

      - name: Release CLI
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release JS SDK
        run: |
          cd sdk/js
          bun run release
        # npm trusted publishing (OIDC via id-token: write), no token. Each
        # package needs a trusted publisher for this workflow on npmjs.com.
        env:
          NPM_CONFIG_PROVENANCE: true

      # Publishes packages/svelte-kit-sst when its version isn't on npm yet, so
      # a pull request that bumps the version ships with the next release. Its
      # tests run in the svelte-kit-sst workflow, not here.
      - name: Release svelte-kit-sst
        working-directory: packages/svelte-kit-sst
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@sst-community/svelte-kit-sst@$version" version >/dev/null 2>&1; then
            echo "@sst-community/svelte-kit-sst@$version is already on npm"
            exit 0
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm ci
          npm publish --access public --tag "$tag"
        env:
          NPM_CONFIG_PROVENANCE: true

      # Posts the release notes to the Discord announcements channel. It's
      # skipped while the DISCORD_WEBHOOK_URL secret isn't set.
      - name: Announce on Discord
        run: .github/scripts/announce-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
