name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Go modules
        run: go mod download

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: TypeScript check
        run: cd platform && bun tsc --noEmit

      # Pushes ghcr.io/sst-community/sst/bridge-task, the image task.ts runs
      # for `sst dev`. The GHCR package must be public for ECS to pull it.
      - name: Build platform
        run: ./platform/scripts/build
        env:
          DOCKER_PUSH: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Run Go tests
        run: go test -vet=all ./...

      # Hand-written notes in .github/release-notes/<tag>.md replace the
      # generated changelog, e.g. for the first release, which has no earlier
      # fork tag to list commits from.
      - name: Release notes
        id: notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then echo "args=--release-notes $notes" >> "$GITHUB_OUTPUT"; fi

      - name: Release CLI
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release JS SDK
        run: |
          cd sdk/js
          bun run release
        # npm trusted publishing (OIDC via id-token: write), no token. Each
        # package needs a trusted publisher for this workflow on npmjs.com.
        env:
          NPM_CONFIG_PROVENANCE: true

      # Posts the release notes to the Discord announcements channel. It's
      # skipped while the DISCORD_WEBHOOK_URL secret isn't set.
      - name: Announce on Discord
        run: .github/scripts/announce-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
