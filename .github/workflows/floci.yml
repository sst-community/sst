name: floci

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "cmd/sst/**"
      - "examples/aws-floci/**"
      - "pkg/server/**"
      - "pkg/floci/**"
      - "pkg/project/**"
      - "platform/**"
      - "sdk/js/**"
      - "go.mod"
      - "go.sum"
      - "bun.lockb"
      - "scripts/floci/**"
      - ".github/workflows/floci.yml"
  push:
    branches: [main]
    paths:
      - "cmd/sst/**"
      - "examples/aws-floci/**"
      - "pkg/server/**"
      - "pkg/floci/**"
      - "pkg/project/**"
      - "platform/**"
      - "sdk/js/**"
      - "go.mod"
      - "go.sum"
      - "bun.lockb"
      - "scripts/floci/**"
      - ".github/workflows/floci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.5.0"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build embedded platform and SDK
        run: |
          bun run build:platform
          bun run build:sdk
        env:
          DOCKER_PUSH: "false"
      - name: Unit tests and types
        run: |
          go test ./cmd/sst ./pkg/floci ./pkg/project/... ./pkg/server/... ./cmd/sst/cli ./cmd/sst/mosaic/errors ./cmd/sst/mosaic/aws/...
          bun run test:platform
          bun run typecheck
          node --test scripts/floci/roundtrip.test.mjs
      - name: Build Linux CLI
        run: go build -o /tmp/sst-floci-dev ./cmd/sst
        env:
          CGO_ENABLED: "0"
      - name: Run full dev on an isolated Docker network
        id: integration
        run: scripts/floci/integration.sh --cleanup
        env:
          CI: "true"
          SST_TEST_CLI: /tmp/sst-floci-dev
      - name: Keep integration logs
        if: always() && steps.integration.outputs.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: floci-integration
          path: |
            ${{ steps.integration.outputs.artifacts }}/*.log
            ${{ steps.integration.outputs.artifacts }}/result.json
            ${{ steps.integration.outputs.artifacts }}/app/.sst/log/**
            ${{ steps.integration.outputs.artifacts }}/negative/.sst/log/**
          if-no-files-found: warn
