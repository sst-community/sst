name: docs

# Builds www/ and publishes it to GitHub Pages at sst-community.github.io/sst.

on:
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "platform/src/**"
      - "cmd/sst/**"
      - "examples/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The whole history, for each page's "Last updated" date.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The CLI reference is generated with `go run ./cmd/sst`, which embeds the
      # built platform.
      - name: Build platform
        run: ./platform/scripts/build
        env:
          DOCKER_PUSH: false

      # SST's own home, about, blog and legal pages aren't the fork's to
      # publish. Links to them point at sst.dev (www/src/fork-links.mjs).
      - name: Remove SST's own pages
        run: rm -rf www/src/content/docs/blog www/src/content/docs/legal www/src/content/docs/about.mdx

      - name: Build docs
        run: cd www && bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_LAST_UPDATED: "true"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: www/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
