name: review

# A first-pass review of each pull request to main or v5, before a committer
# looks: checks that don't need a model (review-prepare.sh), then a review by
# opencode with one of its free models, or a paid one when no free model
# writes it, posted as one comment, a risk label and a `review` status
# (review-post.sh).
#
# pull_request_target runs this file from main with a token that can comment,
# for pull requests from forks too. That's safe only because nothing from the
# pull request runs: the branch it targets is checked out (main or v5, by the
# filter below, which only committers can push to), the diff is fetched as
# text, and opencode can read files and write text but has no edits, no web
# access and no usable shell (.github/review/opencode.json), and no GitHub
# token. The only secret is OPENCODE_API_KEY, which review-run.sh passes to
# opencode alone and keeps out of the comment. The shell tool stays listed,
# with every command denied but `true`, because opencode's free models refuse
# requests that come without it. Keep it that way: never check out the pull
# request's ref here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main, v5]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      MODEL: opencode/glm-5.3-flash-free
      OPENCODE: opencode-ai@1.19.3
    steps:
      # The branch the pull request targets, so the review reads the files the
      # change is made to. pull_request_target checks out main otherwise.
      - name: Checkout ${{ github.event.pull_request.base.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Collect the pull request and run the checks
        run: |
          echo "OUT=$RUNNER_TEMP/review" >> "$GITHUB_ENV"
          OUT="$RUNNER_TEMP/review" .github/scripts/review-prepare.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # opencode starts from a list of models that can be older than MODEL,
      # and then doesn't find it. This fetches the current list from
      # models.dev, for every provider, so opencode-go's models too. No token
      # here either.
      - name: Refresh opencode's models
        continue-on-error: true
        timeout-minutes: 5
        run: npx -y "$OPENCODE" models opencode --refresh >/dev/null

      # review-run.sh picks the free models by the diff's size, tries them with
      # OPENCODE_API_KEY, then a paid model of the key's OpenCode Go plan, and
      # moves on within seconds when a model doesn't answer.
      # A failure still posts the checks.
      - name: Review with opencode
        id: opencode
        continue-on-error: true
        timeout-minutes: 23
        run: .github/scripts/review-run.sh
        env:
          OPENCODE_CONFIG: .github/review/opencode.json
          REVIEW_OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Post the review
        run: .github/scripts/review-post.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OPENCODE_OUTCOME: ${{ steps.opencode.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
