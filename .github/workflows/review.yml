name: review

# A first-pass review of each pull request to main, before a committer looks:
# checks that don't need a model (review-prepare.sh), then a review by opencode
# with one of its free models, posted as one comment, a risk label and a
# `review` status (review-post.sh).
#
# pull_request_target runs this file from main with a token that can comment,
# for pull requests from forks too. That's safe only because nothing from the
# pull request runs: main is checked out, the diff is fetched as text, and
# opencode can read files and write text but has no edits, no web access and
# no usable shell (.github/review/opencode.json), and no token. The shell tool
# stays listed, with every command denied but `true`, because opencode's free
# models refuse requests that come without it. Keep it that way: never
# check out the pull request's ref here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      MODEL: opencode/deepseek-v4.1-flash-free
      OPENCODE: opencode-ai@1.19.3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Collect the pull request and run the checks
        run: |
          echo "OUT=$RUNNER_TEMP/review" >> "$GITHUB_ENV"
          OUT="$RUNNER_TEMP/review" .github/scripts/review-prepare.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # opencode starts from a list of models that can be older than MODEL,
      # and then doesn't find it. This fetches the current list from
      # models.dev. No token here either.
      - name: Refresh opencode's models
        continue-on-error: true
        timeout-minutes: 5
        run: npx -y "$OPENCODE" models opencode --refresh >/dev/null

      # No token here. A failure, such as the free model being unavailable,
      # still posts the checks.
      - name: Review with opencode
        id: opencode
        continue-on-error: true
        timeout-minutes: 15
        run: |
          npx -y "$OPENCODE" run --pure --agent review --model "$MODEL" \
            -f "$OUT/pr.md" -f "$OUT/pr.diff" -- "$(cat .github/review/prompt.md)" \
            </dev/null >"$OUT/review.raw"
        env:
          OPENCODE_CONFIG: .github/review/opencode.json

      - name: Post the review
        run: .github/scripts/review-post.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OPENCODE_OUTCOME: ${{ steps.opencode.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
