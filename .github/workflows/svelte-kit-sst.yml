name: svelte-kit-sst

# Runs the adapter's tests: they build a SvelteKit 2 and a SvelteKit 3 app with
# it, bundle the handler as SST does, and call it with Lambda events.
on:
  push:
    branches:
      - main
    paths:
      - "packages/svelte-kit-sst/**"
      - ".github/workflows/svelte-kit-sst.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "packages/svelte-kit-sst/**"
      - ".github/workflows/svelte-kit-sst.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/svelte-kit-sst
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
