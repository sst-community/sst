version: 2
project_name: sst
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    main: ./cmd/sst
    # Setting ldflags replaces goreleaser's defaults, so main.version is repeated.
    ldflags:
      - -s -w -X main.version={{.Version}}
      - -X github.com/sst/sst/v3/cmd/sst/mosaic/ui.Distribution=sst-community
      # The SST release this build is on, which release.yml works out.
      - -X github.com/sst/sst/v3/cmd/sst/mosaic/ui.Upstream={{ envOrDefault "SST_UPSTREAM" "" }}

archives:
  - formats:
      - tar.gz
    name_template: >-
      sst-
      {{- if eq .Os "darwin" }}mac-
      {{- else if eq .Os "windows" }}windows-
      {{- else if eq .Os "linux" }}linux-{{end}}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "#86" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "0.0.0-{{ .Timestamp }}"
nfpms:
  - maintainer: sst-community
    description: the sst cli
    formats:
      - deb
      - rpm
    file_name_template: >-
      {{ .ProjectName }}-
      {{- if eq .Os "darwin" }}mac
      {{- else }}{{ .Os }}{{ end }}-{{ .Arch }}

changelog:
  use: git
  format: "[{{ .SHA }}](https://github.com/sst-community/sst/commit/{{ .SHA }}): {{ .Message }}"
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^doc:"
      - "^test:"
      - "^ci:"
      - "^ignore:"
      - "^example:"
      - "^wip:"
