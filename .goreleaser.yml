version: 2
project_name: sst
builds:
  - id: sst
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    main: ./cmd/sst
    # Setting ldflags replaces goreleaser's defaults, so main.version is repeated.
    ldflags: &ldflags
      - -s -w -X main.version={{.Version}}
      - -X github.com/sst/sst/v3/cmd/sst/mosaic/ui.Distribution=sst-community
      # The SST release this build is on, which release.yml works out.
      - -X github.com/sst/sst/v3/cmd/sst/mosaic/ui.Upstream={{ envOrDefault "SST_UPSTREAM" "" }}
  # The same binary as the provider SST's own resources run on, which it is
  # when it's named pulumi-resource-sst (cmd/sst/main.go). A Pulumi program
  # that uses SST's components without SST's CLI has Pulumi download it from
  # the release (platform/src/components/plugin.ts).
  - id: plugin
    binary: pulumi-resource-sst
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    main: ./cmd/sst
    ldflags: *ldflags

archives:
  - id: sst
    ids:
      - sst
    formats:
      - tar.gz
    name_template: >-
      sst-
      {{- if eq .Os "darwin" }}mac-
      {{- else if eq .Os "windows" }}windows-
      {{- else if eq .Os "linux" }}linux-{{end}}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "#86" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
  # Named as Pulumi looks for a plugin in a GitHub release, Windows too:
  # pulumi-resource-sst-v<version>-<os>-<arch>.tar.gz, with only the binary
  - id: plugin
    ids:
      - plugin
    formats:
      - tar.gz
    name_template: "pulumi-resource-sst-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - none*
checksum:
  name_template: "checksums.txt"
# A tag with a suffix, such as v5.0.0-alpha.1, is published as a pre-release,
# which GitHub never makes the latest release.
release:
  prerelease: auto
snapshot:
  version_template: "0.0.0-{{ .Timestamp }}"
nfpms:
  - ids:
      - sst
    maintainer: sst-community
    description: the sst cli
    formats:
      - deb
      - rpm
    file_name_template: >-
      {{ .ProjectName }}-
      {{- if eq .Os "darwin" }}mac
      {{- else }}{{ .Os }}{{ end }}-{{ .Arch }}

changelog:
  use: git
  format: "[{{ .SHA }}](https://github.com/sst-community/sst/commit/{{ .SHA }}): {{ .Message }}"
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^doc:"
      - "^test:"
      - "^ci:"
      - "^ignore:"
      - "^example:"
      - "^wip:"
